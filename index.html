function formatDate(ts) { if(!ts) return "—"; return new Date(ts).toLocaleDateString("fr-FR"); }
function getDaysLeft(endTimestamp) { if(!endTimestamp) return 0; const diff = endTimestamp - Date.now(); return Math.max(0, Math.ceil(diff / (1000 * 60 * 60 * 24))); }
function getPlanDuration(plan) { switch(plan) { case "mensuel": return 30; case "trimestriel": return 90; case "annuel": return 365; default: return 30; } }
function calculateEndDate(startDate, plan) { const end = new Date(startDate); end.setDate(end.getDate() + getPlanDuration(plan)); return end.getTime(); }

// ── Helpers logo ──────────────────────────────────────────────────────────
function resizeLogoToBase64(src, maxW, maxH) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const ratio = Math.min(maxW / img.width, maxH / img.height, 1);
      const canvas = document.createElement("canvas");
      canvas.width  = Math.round(img.width  * ratio);
      canvas.height = Math.round(img.height * ratio);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      resolve(canvas.toDataURL("image/png"));
    };
    img.src = src;
  });
}

async function logoToESCPOS(base64, maxWidth) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min((maxWidth || 384) / img.width, 1);
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const byteW = Math.ceil(w / 8);
      const canvas = document.createElement("canvas");
      canvas.width  = byteW * 8;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "white";
      ctx.fillRect(0, 0, canvas.width, h);
      ctx.drawImage(img, 0, 0, w, h);
      const pixels = ctx.getImageData(0, 0, canvas.width, h).data;
      const bytes = [];
      for (let row = 0; row < h; row++) {
        for (let col = 0; col < byteW; col++) {
          let byte = 0;
          for (let bit = 0; bit < 8; bit++) {
            const x = col * 8 + bit;
            const i = (row * canvas.width + x) * 4;
            const brightness = (pixels[i]*299 + pixels[i+1]*587 + pixels[i+2]*114) / 1000;
            if (brightness < 128) byte |= (0x80 >> bit);
          }
          bytes.push(byte);
        }
      }
      const cmd = [
        0x1D, 0x76, 0x30, 0x00,
        byteW & 0xFF, (byteW >> 8) & 0xFF,
        h & 0xFF,     (h     >> 8) & 0xFF,
        ...bytes
      ];
      resolve(cmd);
    };
    img.src = base64;
  });
}

function downloadCSV(rows, filename) {
  const bom = "\uFEFF";
  const csv = bom + rows.map(r => r.map(c => `"${String(c||"").replace(/"/g,'""')}"`).join(";")).join("\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

// ══════════════════════════════════════════════════════════════════
class BLEPrinter {
  constructor() {
    this.device = null;
    this.server = null;
    this.characteristic = null;
    this.connected = false;
    this.listeners = [];
    this.reconnecting = false;
    this._keepAliveTimer = null;
    this._printing = false;
  }

  subscribe(callback) {
    this.listeners.push(callback);
    return () => { this.listeners = this.listeners.filter(l => l !== callback); };
  }

  notify(data) {
    this.listeners.forEach(l => l(data));
  }

  async connect() {
    if (!navigator.bluetooth) {
      throw new Error("Web Bluetooth non disponible. Utilisez Chrome/Edge sur Android.");
    }
    this.notify({ status: "searching", message: "Recherche d'imprimante..." });
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [
        "000018f0-0000-1000-8000-00805f9b34fb",
        "e7810a71-73ae-499d-8c15-faa9aef0c3f2",
        "49535343-fe7d-4ae5-8fa9-9fafd205e455",
        "0000ff00-0000-1000-8000-00805f9b34fb"
      ]
    });
    this.device = device;
    device.addEventListener("gattserverdisconnected", () => {
      this.connected = false;
      this.characteristic = null;
      this.notify({ status: "disconnected", message: "Imprimante déconnectée" });
      this.autoReconnect();
    });
    await this.doConnect();
    this._startKeepAlive();
    this.notify({ status: "connected", message: `Connecté à ${device.name || "Imprimante"}`, name: device.name });
    return device.name;
  }

  async doConnect() {
    this.server = await this.device.gatt.connect();
    const services = await this.server.getPrimaryServices();
    let foundChar = null;
    for (const service of services) {
      const chars = await service.getCharacteristics();
      for (const char of chars) {
        if (char.properties.write || char.properties.writeWithoutResponse) {
          foundChar = char;
          break;
        }
      }
      if (foundChar) break;
    }
    if (!foundChar) throw new Error("Caractéristique d'écriture introuvable");
    this.characteristic = foundChar;
    this.connected = true;
  }

  _startKeepAlive() {
    if (this._keepAliveTimer) clearInterval(this._keepAliveTimer);
    this._keepAliveTimer = setInterval(async () => {
      if (!this.connected || this._printing) return;
      try {
        if (this.characteristic && this.device?.gatt?.connected) {
          const noop = new Uint8Array([0x1B, 0x00]);
          await this.characteristic.writeValueWithoutResponse(noop);
        }
      } catch(e) {
        this.connected = false;
        this.autoReconnect();
      }
    }, 8000);
  }

  _stopKeepAlive() {
    if (this._keepAliveTimer) { clearInterval(this._keepAliveTimer); this._keepAliveTimer = null; }
  }

  async autoReconnect() {
    if (this.reconnecting) return;
    this.reconnecting = true;
    this.notify({ status: "reconnecting", message: "Tentative de reconnexion..." });
    for (let i = 0; i < 5; i++) {
      await new Promise(r => setTimeout(r, 2000));
      try {
        if (this.device && this.device.gatt) {
          await this.doConnect();
          this.reconnecting = false;
          this._startKeepAlive();
          this.notify({ status: "connected", message: "Reconnecté !", name: this.device.name });
          return;
        }
      } catch(e) {}
    }
    this.reconnecting = false;
    this.notify({ status: "disconnected", message: "Reconnexion échouée" });
  }

  async disconnect() {
    this._stopKeepAlive();
    if (this.device && this.device.gatt.connected) {
      this.device.gatt.disconnect();
    }
    this.connected = false;
    this.characteristic = null;
    this.notify({ status: "disconnected", message: "Déconnecté" });
  }

  async print(data) {
    if (!this.connected || !this.characteristic) {
      throw new Error("Imprimante non connectée");
    }
    this._printing = true;
    const chunkSize = 95;
    const useWrite = this.characteristic.properties.writeWithoutResponse === false;
    try {
      for (let i = 0; i < data.length; i += chunkSize) {
        const chunk = data.slice(i, i + chunkSize);
        if (useWrite) {
          await this.characteristic.writeValue(chunk);
        } else {
          await this.characteristic.writeValueWithoutResponse(chunk);
        }
        await new Promise(r => setTimeout(r, 40));
      }
    } finally {
      this._printing = false;
    }
  }
}

const printer = new BLEPrinter();

// ESC/POS Commands
const ESC = 0x1B;
const GS = 0x1D;
const LF = 0x0A;
const COL_80 = 42;
const COL_57 = 32;
const COL = 42; // default 80mm

async function buildESCPOSTicket(shopName, shopPhone, items, total, invoiceNum, col, shopLogo) {
  const C = col || COL_80;
  const buf = [];
  const push = (arr) => buf.push(...arr);
  const text = (str) => {
    for (let i = 0; i < str.length; i++) {
      let code = str.charCodeAt(i);
      if (code >= 32 && code <= 126) buf.push(code);
      else if (code === 0xE9 || code === 0xE8) buf.push(0x65);
      else if (code === 0xE0) buf.push(0x61);
      else if (code === 0xF9) buf.push(0x75);
      else if (code === 0xE7) buf.push(0x63);
    }
  };
  const line = (str) => { text(str); push([LF]); };
  
  push([ESC, 0x40]);
  push([ESC, 0x61, 0x01]);

  // ── Logo ────────────────────────────────────────────────────
  if (shopLogo) {
    try {
      const maxPx = C <= COL_57 ? 384 : 576;
      const logoBytes = await logoToESCPOS(shopLogo, maxPx);
      push(logoBytes);
      push([LF]);
    } catch(e) { console.warn('Logo ESC/POS ignoré:', e); }
  }

  push([ESC, 0x45, 0x01]);
  line(shopName.toUpperCase().slice(0, C));
  push([ESC, 0x45, 0x00]);
  if (shopPhone) line("Tel: " + shopPhone);
  
  const d = new Date();
  const dateStr = `${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getFullYear()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
  line(dateStr);
  if (invoiceNum) line("N° " + String(invoiceNum).slice(-8));
  
  push([ESC, 0x61, 0x00]);
  line("-".repeat(C));
  
  const maxLabel = C <= COL_57 ? 18 : 28;
  items.forEach(it => {
    const label = (it.label || "Article").slice(0, maxLabel);
    const qty = it.qty || 1;
    const price = it.amount;
    const totalLine = price * qty;
    const priceStr = fmtPrice(totalLine);
    const spaces = Math.max(1, C - label.length - priceStr.length);
    line(label + " ".repeat(spaces) + priceStr);
    if (qty > 1) line("  @ " + fmtPrice(price));
  });
  
  line("-".repeat(C));
  push([ESC, 0x45, 0x01]);
  const totalStr = "TOTAL" + " ".repeat(Math.max(1, C - 5 - fmtPrice(total).length)) + fmtPrice(total);
  line(totalStr);
  push([ESC, 0x45, 0x00]);
  line("=".repeat(C));
  
  push([ESC, 0x61, 0x01]);
  line("Merci pour votre achat !");
  line(shopName.slice(0, C));
  push([ESC, 0x64, 0x04]);
  push([GS, 0x56, 0x41, 0x03]);
  
  return new Uint8Array(buf);
}

async function printViaBLE(shopName, shopPhone, items, total, invoiceNum, ticketFormat, shopLogo) {
  if (!printer.connected) throw new Error("Imprimante non connectée");
  const col = ticketFormat === "57mm" ? COL_57 : COL_80;
  const ticket = await buildESCPOSTicket(shopName, shopPhone, items, total, invoiceNum, col, shopLogo);
  await printer.print(ticket);
  return true;
}

function printFallback(shopName, shopPhone, items, total, invoiceNum, ticketFormat, shopLogo) {
  const w = ticketFormat === "57mm" ? "50mm" : "70mm";
  let html = `<html><head><meta charset="utf-8"><title>Ticket</title><style>body{font-family:monospace;width:${w};margin:0 auto;padding:10px}.center{text-align:center}.item{display:flex;justify-content:space-between;margin:3px 0}.total{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px dashed #000;font-weight:bold}</style></head><body>`;
  if(shopLogo) html += `<div class="center"><img src="${shopLogo}" style="max-width:160px;max-height:60px;margin:0 auto 6px;display:block;" /></div>`;
  html += `<div class="center bold">${shopName.toUpperCase()}</div>`;
  if(shopPhone) html += `<div class="center">Tel: ${shopPhone}</div>`;
  html += `<div class="center">${new Date().toLocaleString()}</div>`;
  if(invoiceNum) html += `<div class="center">N° ${String(invoiceNum).slice(-8)}</div><hr>`;
  items.forEach(it => { const qty=it.qty||1; html += `<div class="item"><span>${it.label}${qty>1?` x${qty}`:''}</span><span>${fmtPrice(it.amount*qty)}</span></div>`; if(qty>1) html += `<div style="font-size:10px;margin-left:8px;">@ ${fmtPrice(it.amount)}</div>`; });
  html += `<hr><div class="total"><span>TOTAL</span><span>${fmtPrice(total)}</span></div><hr><div class="center">Merci !</div></body></html>`;
  const win = window.open("", "_blank", "width=400,height=600");
  if(win) { win.document.write(html); win.document.close(); win.print(); setTimeout(()=>win.close(),1500); }
}

function SubscriptionBanner({ T, shopId }) {
  const [subscription, setSubscription] = useState(null);
  const [loading, setLoading] = useState(true);
  
  useEffect(() => {
    if(!db || !shopId) return;
    const unsub = db.collection("shops").doc(shopId).onSnapshot(doc => {
      if(doc.exists) {
        const data = doc.data();
        setSubscription({ 
          end: data.subscriptionEnd, 
          plan: data.plan || "mensuel",
          start: data.subscriptionStart
        });
      }
      setLoading(false);
    });
    return unsub;
  }, [shopId]);
  
  if(loading || !subscription || !subscription.end) return null;
  
  const daysLeft = getDaysLeft(subscription.end);
  const expired = daysLeft === 0;
  const warning = daysLeft <= 7 && daysLeft > 0;
  
  if(!expired && !warning) return null;
  
  const bgColor = expired ? T.red : T.orange;
  const message = expired

  return (
    <div style={{ 
      background: bgColor, 
      color: "#fff", 
      padding: "10px 12px", 
      overflow: "hidden", 
      whiteSpace: "nowrap", 
      position: "relative", 
      flexShrink: 0,
      boxShadow: "inset 0 -2px 0 rgba(0,0,0,0.1)",
      zIndex: 10
    }}>
      <div className="marquee" style={{ display: "inline-block", paddingRight: "80px" }}>
        {message} &nbsp;&nbsp;&nbsp; {message} &nbsp;&nbsp;&nbsp; {message}
      </div>
      <a 
        href={`https://wa.me/${DEV_WHATSAPP}?text=${encodeURIComponent(`Bonjour, je souhaite renouveler mon abonnement (${subscription.plan}) pour ${subscription.plan === "mensuel" ? "30 jours" : subscription.plan === "trimestriel" ? "90 jours" : "365 jours"}`)}`}

        rel="noopener noreferrer"

          top: "50%",

  );

// ══════════════════════════════════════════════════════════════════
//  COMPOSANT BLE STATUS
// ══════════════════════════════════════════════════════════════════
function BLEStatus({ T }) {
  const [status, setStatus] = useState({ status: "disconnected", message: "Hors ligne" });
  const [connecting, setConnecting] = useState(false);
  const [testPrinting, setTestPrinting] = useState(false);
  
  useEffect(() => {
    const unsub = printer.subscribe(setStatus);
    return unsub;
  }, []);
  
  const connect = async () => {
    setConnecting(true);
    try {
      await printer.connect();
    } catch(e) {
      setStatus({ status: "error", message: e.message });
    }
    setConnecting(false);
  };
  
  const disconnect = () => printer.disconnect();
  
  const testPrint = async () => {
    if (!printer.connected) { alert("Connectez d'abord l'imprimante"); return; }
    setTestPrinting(true);
    try {
      const testItems = [{ label: "TEST IMPRESSION THERMIQUE", amount: 500, qty: 1 }, { label: "ESC/POS BLE - Impression OK", amount: 250, qty: 2 }];
      await printViaBLE("TEST CAISSE PRO", "", testItems, 1000, Date.now(), "80mm");
      alert("✅ Impression test envoyée avec succès !");
    } catch(e) { alert("❌ Erreur: " + e.message); }
    setTestPrinting(false);
  };
  
  const isConnected = status.status === "connected";
  const color = isConnected ? T.green : (status.status === "searching" || status.status === "reconnecting" ? T.blue : T.red);
  const icon = isConnected ? "🖨️" : (status.status === "searching" || status.status === "reconnecting" ? "⏳" : "❌");
  
  return (
    <div style={{ background: T.surface, borderRadius: 12, padding: 10, marginBottom: 12, border: `1px solid ${color}` }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 24 }}>{icon}</span>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600, color }}>{isConnected ? "Imprimante connectée" : (status.status === "searching" ? "Recherche..." : status.status === "reconnecting" ? "Reconnexion..." : "Hors ligne")}</div>
            {status.name && <div style={{ fontSize: 10, color: T.textMute }}>{status.name}</div>}
            {status.message && !isConnected && <div style={{ fontSize: 9, color: T.textMute }}>{status.message}</div>}
          </div>
        </div>
        <div style={{ display: "flex", gap: 6 }}>
          {!isConnected ? (
            <button onClick={connect} disabled={connecting} style={{ background: T.btnGreen.bg, border:`1px solid ${T.border}`, borderRadius: 8, padding: "6px 12px", fontSize: 11, color: T.green, fontWeight: 600 }}>{connecting ? "..." : "🔌 Connecter"}</button>
          ) : (
            <>
              <button onClick={testPrint} disabled={testPrinting} style={{ background: T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius: 8, padding: "4px 10px", fontSize: 10, color: T.blue }}>{testPrinting ? "..." : "🖨️ Test"}</button>
              <button onClick={disconnect} style={{ background: T.btnRed.bg, border:`1px solid ${T.red}44`, borderRadius: 8, padding: "4px 10px", fontSize: 10, color: T.red }}>Déco</button>
            </>
          )}
        </div>
      </div>
      {isConnected && <div style={{ fontSize: 9, color: T.textMute, marginTop: 6, textAlign: "center" }}>✅ ESC/POS — Formats 80mm & 57mm disponibles</div>}
    </div>
  );
}

//  COMPOSANT VENTE RAPIDE
// ══════════════════════════════════════════════════════════════════
function VenteRapide({ T, addSale, flashMsg }) {
  const [lines, setLines] = useState([]);
  const [montant, setMontant] = useState("");
  const [label, setLabel] = useState("");
  const [modeMonnaie, setModeMonnaie] = useState(false);
  const [recu, setRecu] = useState("");
  
  const montantNum = parseInt(montant) || 0;
  const totalLines = lines.reduce((s,l)=>s + l.montant, 0);
  const recuNum = parseInt(recu) || 0;
  const monnaie = recuNum - totalLines;
  const BILLS = [500, 1000, 2000, 5000, 10000, 25000];
  
  const ajouterLigne = () => {
    if(!montantNum || montantNum < 1) { flashMsg("Entrez un montant"); return; }
    const nom = label.trim() || `Vente ${fmtPrice(montantNum)}`;
    setLines([...lines, { id: Date.now()+Math.random(), label: nom, montant: montantNum }]);
    setMontant("");
    setLabel("");
  };
  
  const supprimerLigne = (id) => setLines(lines.filter(l=>l.id!==id));
  const reset = () => { setLines([]); setMontant(""); setLabel(""); setModeMonnaie(false); setRecu(""); };
  
  const valider = (print) => {
    if(lines.length === 0) { flashMsg("Ajoutez des lignes"); return; }
    const items = lines.map(l => ({ label: l.label, amount: l.montant, qty: 1 }));
    addSale(items, totalLines, print);
    reset();
  };
  
  const pushDigit = (d) => {
    if(modeMonnaie) setRecu(p => p.length >= 8 ? p : p + d);
    else setMontant(p => p.length >= 8 ? p : p + d);
  };
  const del = () => {
    if(modeMonnaie) setRecu(p => p.slice(0,-1));
    else setMontant(p => p.slice(0,-1));
  };
  
  return (
    <div style={{display:"flex", flexDirection:"column"}}>
      <div style={{padding:"0 0 4px"}}>
        <div style={{background:T.surface, borderRadius:16, padding:16, marginBottom:12, border:`2px solid ${modeMonnaie ? T.blue : (montantNum>0 ? T.accent : T.border)}`}}>
          {!modeMonnaie && <input placeholder="Libellé (optionnel)" value={label} onChange={e=>setLabel(e.target.value)} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:10, padding:10, marginBottom:10, color:T.text}} />}
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"baseline"}}>
            <span style={{fontSize:11, color:T.textMute}}>{modeMonnaie ? "Montant reçu" : "Montant"}</span>
            <span style={{fontSize:36, fontWeight:800, color:modeMonnaie ? T.blue : (montantNum>0 ? T.accent : T.textMute)}}>
              {modeMonnaie ? (recu ? fmtPrice(recuNum) : "—") : (montant ? fmtPrice(montantNum) : "0 F")}
            </span>
          </div>
        </div>
        
        {modeMonnaie && (
          <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8, marginBottom:12}}>
            {BILLS.map(b=><button key={b} onClick={()=>setRecu(String(b))} style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, padding:12, fontWeight:700}}>{b>=1000?(b/1000)+"k":b}</button>)}
          </div>
        )}
        
        {lines.length > 0 && (
          <div style={{marginBottom:12}}>
            <div style={{fontSize:10, color:T.textMute, marginBottom:6}}>Lignes ({lines.length})</div>
            {lines.map((l,idx)=>(
              <div key={l.id} style={{background:T.surface2, borderRadius:10, padding:10, marginBottom:6, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <div><span style={{color:T.textMute, marginRight:8}}>{idx+1}.</span><span>{l.label}</span></div>
                <div style={{display:"flex", alignItems:"center", gap:10}}>
                  <span style={{fontWeight:700, color:T.accent}}>{fmtPrice(l.montant)}</span>
                  {!modeMonnaie && <button onClick={()=>supprimerLigne(l.id)} style={{background:T.btnRed.bg, border:"none", borderRadius:6, width:28, height:28, color:T.red, fontSize:16}}>×</button>}
                </div>
              </div>
            ))}
            <div style={{background:T.btnGreen.bg, borderRadius:12, padding:12, marginTop:6, display:"flex", justifyContent:"space-between", border:`1px solid ${T.green}`}}>
              <span style={{fontWeight:700}}>TOTAL</span>
              <span style={{fontSize:20, fontWeight:800, color:T.green}}>{fmtPrice(totalLines)}</span>
            </div>
          </div>
        )}
        
        {modeMonnaie && recuNum > 0 && (
          <div style={{background:monnaie>=0 ? T.btnGreen.bg : T.btnRed.bg, borderRadius:12, padding:16, textAlign:"center", marginBottom:12}}>
            <div style={{fontSize:11, color:T.textMute}}>Monnaie à rendre</div>
            <div style={{fontSize:32, fontWeight:800, color:monnaie>=0 ? T.green : T.red}}>{monnaie>=0 ? fmtPrice(monnaie) : `-${fmtPrice(Math.abs(monnaie))}`}</div>
          </div>
        )}
      </div>
      
      <div style={{position:"sticky", bottom:0, background:T.bg, padding:"10px 0 0", zIndex:10}}>
        <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:6}}>
          {[7,8,9,4,5,6,1,2,3].map(d=><button key={d} onClick={()=>pushDigit(String(d))} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:58, fontSize:24, fontWeight:600, color:T.text}}>{d}</button>)}
          <button onClick={()=>pushDigit("00")} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:58, fontSize:18}}>00</button>
          <button onClick={()=>pushDigit("0")} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:58, fontSize:24}}>0</button>
          <button onClick={del} style={{background:T.btnRed.bg, border:`1px solid ${T.red}44`, borderRadius:12, height:58, fontSize:20, color:T.red}}>⌫</button>
        </div>
        
        {!modeMonnaie ? (
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:8}}>
            <button onClick={reset} style={{background:"transparent", border:`1px solid ${T.red}44`, borderRadius:12, padding:12, color:T.red, fontWeight:600}}>✕ Annuler</button>
            <button onClick={ajouterLigne} style={{background:T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius:12, padding:12, color:T.blue, fontWeight:700}}>➕ Ajouter ligne</button>
            <button onClick={()=>{ if(lines.length) setModeMonnaie(true); else flashMsg("Ajoutez des lignes d'abord"); }} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:12, fontWeight:600}}>💵 Monnaie</button>
            <button onClick={()=>valider(true)} style={{background:T.btnGreen.bg, border:`2px solid ${T.green}`, borderRadius:12, padding:12, color:T.green, fontWeight:800}}>🖨️ Valider</button>
          </div>
        ) : (
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginTop:8}}>
            <button onClick={()=>{ setModeMonnaie(false); setRecu(""); }} style={{background:T.surface2, border:`1px solid ${T.border}`, borderRadius:12, padding:12}}>← Retour</button>
            <button onClick={()=>valider(false)} style={{background:T.btnBlue.bg, border:`1px solid ${T.border}`, borderRadius:12, padding:12, color:T.blue, fontWeight:600}}>✅ Sans ticket</button>
            <button onClick={()=>valider(true)} style={{background:T.btnGreen.bg, border:`2px solid ${T.green}`, borderRadius:12, padding:12, color:T.green, fontWeight:800}}>🖨️ Imprimer</button>
          </div>
        )}
        {/* Spacer FAB mobile */}
        <div style={{height:80}} />
      </div>
    </div>
  );
}

function App() {
  const [themeName, setThemeName] = useState(()=>localStorage.getItem("pos_theme")||"auto");
  const T = resolveTheme(themeName);

  // Écoute les changements de préférence système quand mode=auto
  useEffect(() => {
    if (themeName !== "auto") return;
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    const handler = () => { /* force re-render */ setThemeName(n => n === "auto" ? "auto" : n); };
    mq.addEventListener ? mq.addEventListener("change", handler) : mq.addListener(handler);
    return () => mq.removeEventListener ? mq.removeEventListener("change", handler) : mq.removeListener(handler);
  }, [themeName]);
  const [session, setSession] = useState(null);
  const [authMode, setAuthMode] = useState("login");
  const [authShopName, setAuthShopName] = useState("");
  const [authOwnerName, setAuthOwnerName] = useState("");
  const [authWhatsapp, setAuthWhatsapp] = useState("");
  const [authPhone, setAuthPhone] = useState("");
  const [authPassword, setAuthPassword] = useState("");
  const [authConfirm, setAuthConfirm] = useState("");
  const [authError, setAuthError] = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [flash, setFlash] = useState(null);
  const [devMode, setDevMode] = useState(false);
  const [devPin, setDevPin] = useState("");
  const [devPinError, setDevPinError] = useState(false);
  const [devPinShake, setDevPinShake] = useState(false);
  const clickCountRef = useRef({ count: 0, timer: null });
  
  const flashMsg = (msg) => { setFlash(msg); setTimeout(()=>setFlash(null),2500); };

  useEffect(()=>{ document.body.style.background = T.bg; document.documentElement.setAttribute("data-theme", T.mode||"dark"); localStorage.setItem("pos_theme", themeName); }, [themeName, T.bg]);

  const handleLogoTripleClick = () => {
    const ref = clickCountRef.current;
    ref.count++;
    clearTimeout(ref.timer);
    if (ref.count >= 3) {
      ref.count = 0;
      setDevMode(true);
      setDevPin("");
      setDevPinError(false);
    }
    ref.timer = setTimeout(() => { ref.count = 0; }, 500);
  };

  const verifyDevPin = () => {
    if (devPin === DEV_PIN) {
      setDevMode(false);
      setDevPin("");
      setSession({ shopId: "dev_dashboard", shopName: "Développeur", ownerName: "Admin", isDev: true });
    } else {
      setDevPinError(true);
      setDevPinShake(true);
      setTimeout(() => { setDevPinShake(false); setDevPin(""); setDevPinError(false); }, 700);
    }
  };

  const handleRegister = async () => {
    if(!authShopName.trim() || !authOwnerName.trim() || !authWhatsapp.trim() || authPassword.length<4 || authPassword!==authConfirm) { setAuthError("Vérifiez les champs"); return; }
    setAuthLoading(true);
    try {
      const existing = await db.collection("shops").where("shopName", "==", authShopName.trim()).get();
      if(!existing.empty) throw new Error("Nom déjà utilisé");
      const shopId = "shop_"+Date.now()+"_"+Math.random().toString(36).slice(2,6);

      await db.collection("shops").doc(shopId).set({ 
        shopName: authShopName.trim(), ownerName: authOwnerName.trim(), whatsapp: authWhatsapp.trim(), phone: authPhone.trim(), 
        password: btoa(authPassword), createdAt: now, active: true, plan: "mensuel", 
        subscriptionStart: now, subscriptionEnd: calculateEndDate(now, "mensuel"),
        adminPin: btoa("0000"), logoBase64: null
      });
      await db.collection("shops").doc(shopId).collection("products").doc("_init").set({init:true});
      await db.collection("shops").doc(shopId).collection("sales").doc("_init").set({init:true});
      await db.collection("shops").doc(shopId).collection("stock_movements").doc("_init").set({init:true});
      flashMsg("Commerce créé ! Connectez-vous");
      setAuthMode("login");
    } catch(e) { setAuthError(e.message); }
    setAuthLoading(false);
  };

  const handleLogin = async () => {
    if(!authShopName.trim() || !authPassword) { setAuthError("Nom et mot de passe requis"); return; }
    setAuthLoading(true);
    const shopKey = authShopName.trim().toLowerCase();
    const cached = SessionCache.get(shopKey);

    // Hors-ligne dès le départ → utiliser directement la session en cache
    if (typeof navigator !== "undefined" && navigator.onLine === false) {
      if (cached && cached.passwordHash === btoa(authPassword)) {
        setSession({ ...cached.session, _offline: true });
        flashMsg("📡 Mode hors-ligne — connexion en attente du réseau");
      } else {
        setAuthError(cached ? "Mot de passe incorrect (mode hors-ligne)" : "Hors-ligne : aucune session enregistrée sur cet appareil");
      }
      setAuthLoading(false);
      return;
    }

    try {
      const query = await db.collection("shops").where("shopName", "==", authShopName.trim()).get();
      if(query.empty) throw new Error("Commerce introuvable");
      const doc = query.docs[0];
      const data = doc.data();
      if(btoa(authPassword) !== data.password) throw new Error("Mot de passe incorrect");
      if(data.active === false) throw new Error("Compte désactivé");
      const newSession = { 
        shopId: doc.id, shopName: data.shopName, shopPhone: data.phone || "", 
        whatsapp: data.whatsapp, ownerName: data.ownerName, plan: data.plan || "mensuel", 
        subscriptionEnd: data.subscriptionEnd, adminPin: data.adminPin || btoa("0000"), isDev: false,
        shopLogo: data.logoBase64 || null
      };
      SessionCache.save(shopKey, newSession, authPassword);
      setSession(newSession);
    } catch(e) {
      // Erreur réseau (hors-ligne, requête bloquée, etc.) → repli sur la session en cache
      const isNetworkError = e.code === "unavailable" || /offline|network|internet|failed to get|fetch/i.test(e.message||"");
      if (isNetworkError && cached && cached.passwordHash === btoa(authPassword)) {
        setSession({ ...cached.session, _offline: true });
        flashMsg("📡 Connexion au serveur impossible — mode hors-ligne activé");
      } else {
        setAuthError(e.message);
      }
    }
    setAuthLoading(false);
  };

  const logout = () => setSession(null);

  // ── Suivi connexion réseau + resynchronisation de la session ──────────────
  const [isOnline, setIsOnline] = useState(typeof navigator!=="undefined" ? navigator.onLine : true);
  useEffect(() => {
    const goOnline = async () => {
      setIsOnline(true);
      if (session && session._offline && session.shopId && !session.isDev) {
        try {
          const doc = await db.collection("shops").doc(session.shopId).get();
          if (doc.exists) {
            const data = doc.data();
            const refreshed = {
              ...session,
              shopName: data.shopName, shopPhone: data.phone || "", whatsapp: data.whatsapp,
              ownerName: data.ownerName, plan: data.plan || "mensuel", subscriptionEnd: data.subscriptionEnd,
              adminPin: data.adminPin || session.adminPin, shopLogo: data.logoBase64 || session.shopLogo,
              _offline: false
            };
            SessionCache.updateSession(session.shopName.trim().toLowerCase(), refreshed);
            setSession(refreshed);
            flashMsg("✅ Connexion rétablie — synchronisation des données…");
          }
        } catch(e) { /* sera retenté à la prochaine reconnexion */ }
      }
    };
    const goOffline = () => setIsOnline(false);
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return () => { window.removeEventListener("online", goOnline); window.removeEventListener("offline", goOffline); };
  }, [session]);

  if (devMode) {
    return (
      <div style={{minHeight:"100dvh", background:T.bg, display:"flex", alignItems:"center", justifyContent:"center", padding:16, overflowY:"auto"}}>
        <div style={{maxWidth:400, width:"100%", background:T.surface, borderRadius:32, padding:32, textAlign:"center", border:`1px solid ${T.border}`}}>
          <div style={{fontSize:48, marginBottom:16}}>🔧</div>
          <div style={{fontFamily:"'Outfit'", fontSize:20, fontWeight:800, color:T.purple, marginBottom:8}}>Accès Développeur</div>
          <div style={{display:"flex", gap:12, justifyContent:"center", marginBottom:24, animation: devPinShake ? "shake 0.35s ease" : "none"}}>
            {Array(6).fill(0).map((_,i)=><div key={i} style={{width:16,height:16,borderRadius:"50%", background: i < devPin.length ? (devPinError ? T.red : T.accent) : T.border}} />)}
          </div>
          {devPinError && <div style={{fontSize:12, color:T.red, marginBottom:16}}>✗ Code incorrect</div>}
          <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:10}}>
            {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d,i)=>(
              <button key={i} onClick={()=>{ if(d==="⌫") setDevPin(p=>p.slice(0,-1)); else if(d!=="") setDevPin(p=>p.length<6 ? p+d : p); }} style={{background:d===""?"transparent":T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:60, fontSize:22, color:d==="⌫"?T.red:T.text}}>{d}</button>
            ))}
          </div>
          <button onClick={verifyDevPin} style={{marginTop:20, background:T.accent, border:"none", borderRadius:12, padding:12, width:"100%", fontWeight:700, color:T.bg}}>Valider</button>
          <button onClick={()=>{setDevMode(false); setDevPin("");}} style={{marginTop:12, background:"transparent", border:"none", color:T.textMute, fontSize:12}}>← Retour</button>
        </div>
      </div>
    );
  }

  if(!session) {
    return (
      <div style={{minHeight:"100dvh", background:T.bg, display:"flex", alignItems:"center", justifyContent:"center", padding:16, overflowY:"auto"}}>
        <div style={{maxWidth:420, width:"100%", background:T.surface, borderRadius:28, padding:"20px 20px 28px", border:`1px solid ${T.border}`, margin:"auto"}}>
          <div style={{textAlign:"center", marginBottom:24, cursor:"pointer"}} onClick={handleLogoTripleClick}>
            <div style={{fontSize:42}}>🏪</div>
            <div style={{fontFamily:"'Outfit'", fontSize:28, fontWeight:800, color:T.accent}}>Caisse SaaS Pro</div>
            <div style={{fontSize:10, color:T.textMute, marginTop:4}}>Triple-clic mode développeur</div>
          </div>
          {flash && <div style={{background:T.btnRed.bg, color:T.red, padding:8, borderRadius:8, marginBottom:12, textAlign:"center"}}>{flash}</div>}
          <div style={{display:"flex", gap:8, marginBottom:20, background:T.surface2, borderRadius:12, padding:4}}>
            <button onClick={()=>{setAuthMode("login"); setAuthError("");}} style={{flex:1, background:authMode==="login"?T.accent:"transparent", border:"none", borderRadius:8, padding:"8px", fontWeight:700, color:authMode==="login"?T.bg:T.textSub}}>Connexion</button>
            <button onClick={()=>{setAuthMode("register"); setAuthError("");}} style={{flex:1, background:authMode==="register"?T.accent:"transparent", border:"none", borderRadius:8, padding:"8px", fontWeight:700, color:authMode==="register"?T.bg:T.textSub}}>Créer</button>
          </div>
          <div style={{display:"flex", flexDirection:"column", gap:12}}>
            <input placeholder="Nom du commerce" value={authShopName} onChange={e=>setAuthShopName(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} />
            {authMode==="register" && (<><input placeholder="Nom du propriétaire" value={authOwnerName} onChange={e=>setAuthOwnerName(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} /><input placeholder="WhatsApp" value={authWhatsapp} onChange={e=>setAuthWhatsapp(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} /><input placeholder="Téléphone" value={authPhone} onChange={e=>setAuthPhone(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} /></>)}
            <input type="password" placeholder="Mot de passe" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} />
            {authMode==="register" && <input type="password" placeholder="Confirmer" value={authConfirm} onChange={e=>setAuthConfirm(e.target.value)} style={{background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:14, padding:"14px", color:T.text}} />}
            {authError && <div style={{fontSize:12, color:T.red, textAlign:"center"}}>{authError}</div>}
            <button onClick={authMode==="register"?handleRegister:handleLogin} disabled={authLoading} style={{background:T.accent, border:"none", borderRadius:16, padding:"16px", fontWeight:800, fontSize:16, color:T.bg}}>{authLoading ? "..." : (authMode==="register" ? "Créer" : "Se connecter")}</button>
          </div>
        </div>
      </div>
    );
  }

  if(session.isDev) return <DevDashboard T={T} themeName={themeName} setThemeName={setThemeName} logout={logout} flashMsg={flashMsg} />;
  return <MainApp session={session} T={T} themeName={themeName} setThemeName={setThemeName} logout={logout} flashMsg={flashMsg} isOnline={isOnline} />;
}

// ══════════════════════════════════════════════════════════════════
//  MAIN APP AVEC BANDE D'ABONNEMENT
// ══════════════════════════════════════════════════════════════════
function MainApp({ session, T, themeName, setThemeName, logout, flashMsg, isOnline }) {
  const [products, setProducts] = useState(() => OfflineStore.get(session.shopId, "products") || []);
  const [sales, setSales] = useState(() => OfflineStore.get(session.shopId, "sales") || []);
  const [stockMovements, setStockMovements] = useState(() => OfflineStore.get(session.shopId, "stock_movements") || []);
  const [credits, setCredits] = useState(() => OfflineStore.get(session.shopId, "credits") || []);
  const [caissiers, setCaissiers] = useState(() => OfflineStore.get(session.shopId, "caissiers") || []);
  const [currentCaissier, setCurrentCaissier] = useState(() => { try { return JSON.parse(sessionStorage.getItem("pos_caissier_"+session.shopId)||"null"); } catch(e){ return null; } });
  const [mode, setMode] = useState("CAISSE");
  const [items, setItems] = useState([]);
  const [ownerMode, setOwnerMode] = useState(false);
  const [pinModal, setPinModal] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [pinShake, setPinShake] = useState(false);
  const [useBLE, setUseBLE] = useState(true);
  const [ticketFormat, setTicketFormat] = useState(() => localStorage.getItem("pos_ticket_fmt") || "80mm");
  const [mobileCartOpen, setMobileCartOpen] = useState(false);
  const [shopLogo, setShopLogo] = useState(session.shopLogo || null);

  useEffect(() => { const unsub = syncShopData(session.shopId, setProducts, setSales, setStockMovements, setCredits, setCaissiers); return unsub; }, [session.shopId]);

  const total = items.reduce((s,i)=>s + (i.amount || 0) * (i.qty || 1), 0);
  
  const updateStock = async (productId, quantity, type, reason) => {
    const product = products.find(p => p.id === productId);
    if (!product) return;
    if (product.stock === null || product.stock === undefined || product.stock === -1) return;
    const newStock = Math.max(0, (product.stock || 0) + quantity);
    const updatedProducts = products.map(p => p.id === productId ? { ...p, stock: newStock } : p);
    setProducts(updatedProducts);
    OfflineStore.set(session.shopId, "products", updatedProducts);
    const movement = { id: Date.now().toString(36)+Math.random().toString(36).slice(2), productId, productName: product.name, quantity, type, reason, timestamp: Date.now() };
    setStockMovements([movement, ...stockMovements]);
    OfflineStore.set(session.shopId, "stock_movements", [movement, ...stockMovements]);
    if(db) {
      await db.collection("shops").doc(session.shopId).collection("products").doc(productId).update({ stock: newStock });
      await db.collection("shops").doc(session.shopId).collection("stock_movements").doc(movement.id).set(movement);
    }
  };

  const addSale = async (saleItems, saleTotal, print=true) => {
    for (const item of saleItems) {
      const product = products.find(p => p.id === item.productId);
      if (product && product.stock !== null && product.stock !== undefined && product.stock !== -1) {
        await updateStock(item.productId, - (item.qty || 1), "sortie", `Vente #${Date.now()}`);
      }
    }
    const newSale = { id: Date.now().toString(36)+Math.random().toString(36).slice(2), date: new Date().toISOString().slice(0,10), timestamp: Date.now(), items: saleItems, total: saleTotal, invoiceNum: Date.now(), cancelled: false, caissier: currentCaissier?.name || null };
    setSales([...sales, newSale]);
    OfflineStore.set(session.shopId, "sales", [...sales, newSale]);
    if(db) db.collection("shops").doc(session.shopId).collection("sales").doc(newSale.id).set(newSale).catch(()=>{});
    if(print) {
      try {
        if (useBLE && printer.connected) {
          await printViaBLE(session.shopName, session.shopPhone, saleItems, saleTotal, newSale.invoiceNum, ticketFormat, shopLogo);
          flashMsg(`✅ Vente + impression BLE ${ticketFormat}`);
        } else {
          printFallback(session.shopName, session.shopPhone, saleItems, saleTotal, newSale.invoiceNum, ticketFormat, shopLogo);
          flashMsg("✅ Vente + impression navigateur");
        }
      } catch(e) {
        printFallback(session.shopName, session.shopPhone, saleItems, saleTotal, newSale.invoiceNum, ticketFormat, shopLogo);
        flashMsg("✅ Vente (fallback)");
      }
    } else {
      flashMsg("✅ Vente enregistrée");
    }
    setItems([]);
  };

  const addCredit = async (saleItems, saleTotal, clientName) => {
    for (const item of saleItems) {
      const product = products.find(p => p.id === item.productId);
      if (product && product.stock !== null && product.stock !== undefined && product.stock !== -1) {
        await updateStock(item.productId, -(item.qty||1), "sortie", `Crédit ${clientName}`);
      }
    }
    const newCredit = { id: Date.now().toString(36)+Math.random().toString(36).slice(2), clientName, items: saleItems, total: saleTotal, paidAmount: 0, paid: false, date: new Date().toISOString().slice(0,10), timestamp: Date.now(), caissier: currentCaissier?.name || null, payments: [] };
    const updated = [...credits, newCredit];
    setCredits(updated);
    OfflineStore.set(session.shopId, "credits", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("credits").doc(newCredit.id).set(newCredit).catch(()=>{});
    flashMsg(`💳 Crédit enregistré pour ${clientName}`);
    setItems([]);
  };

  const payCredit = async (creditId, amount) => {
    const credit = credits.find(c=>c.id===creditId);
    if(!credit) return;
    const newPaid = (credit.paidAmount||0) + amount;
    const paid = newPaid >= credit.total;
    const payment = { amount, date: new Date().toISOString().slice(0,10), timestamp: Date.now() };
    const updated = credits.map(c=>c.id===creditId?{...c, paidAmount:newPaid, paid, payments:[...(c.payments||[]), payment]}:c);
    setCredits(updated);
    OfflineStore.set(session.shopId, "credits", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("credits").doc(creditId).update({paidAmount:newPaid, paid, payments:[...(credit.payments||[]), payment]}).catch(()=>{});
    flashMsg(paid ? `✅ Crédit ${credit.clientName} soldé !` : `💰 Paiement partiel enregistré`);
  };

  const loginCaissier = (caissier) => {
    setCurrentCaissier(caissier);
    sessionStorage.setItem("pos_caissier_"+session.shopId, JSON.stringify(caissier));
    flashMsg(`👤 ${caissier.name} connecté`);
  };
  const logoutCaissier = () => {
    setCurrentCaissier(null);
    sessionStorage.removeItem("pos_caissier_"+session.shopId);
    flashMsg("👤 Caissier déconnecté");
  };
  const saveCaissier = async (caissier) => {
    const updated = caissiers.find(c=>c.id===caissier.id) ? caissiers.map(c=>c.id===caissier.id?caissier:c) : [...caissiers, caissier];
    setCaissiers(updated);
    OfflineStore.set(session.shopId, "caissiers", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("caissiers").doc(caissier.id).set(caissier).catch(()=>{});
  };
  const deleteCaissier = async (id) => {
    const updated = caissiers.filter(c=>c.id!==id);
    setCaissiers(updated);
    OfflineStore.set(session.shopId, "caissiers", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("caissiers").doc(id).delete().catch(()=>{});
  };

  const cancelSale = (saleId, raison) => {
    const sale = sales.find(s => s.id === saleId);
    if (sale && !sale.cancelled) {
      for (const item of sale.items) {
        if (item.productId) updateStock(item.productId, item.qty || 1, "entree", `Annulation vente #${sale.invoiceNum}`);
      }
    }
    const updated = sales.map(s => s.id===saleId ? {...s, cancelled:true, cancelRaison:raison, cancelledAt:Date.now()} : s);
    setSales(updated);
    OfflineStore.set(session.shopId, "sales", updated);
    if(db) db.collection("shops").doc(session.shopId).collection("sales").doc(saleId).update({cancelled:true, cancelRaison:raison, cancelledAt:Date.now()}).catch(()=>{});
    flashMsg(`🗑️ Vente annulée : ${raison}`);
  };

  const verifyAdminPin = () => {
    const expectedPin = atob(session.adminPin || btoa("0000"));
    if (pinInput === expectedPin) {
      setPinModal(false);
      setPinInput("");
      setOwnerMode(true);
      setMode("CAISSE");
    } else {
      setPinError(true);
      setPinShake(true);
      setTimeout(() => { setPinShake(false); setPinInput(""); setPinError(false); }, 700);
    }
  };

  const enterOwnerMode = () => { setPinModal(true); setPinInput(""); setPinError(false); };
  const exitOwnerMode = () => { setOwnerMode(false); };

  const updateAdminPin = async (newPin) => {
    const newEncoded = btoa(newPin);
    await db.collection("shops").doc(session.shopId).update({ adminPin: newEncoded });
    session.adminPin = newEncoded;
    flashMsg("PIN administrateur modifié");
  };

  return (
    <div style={{height:"100dvh", background:T.bg, display:"flex", flexDirection:"column"}}>
      {/* BANDE D'ABONNEMENT DÉFILANTE */}
      <SubscriptionBanner T={T} shopId={session.shopId} />

      {(!isOnline || session._offline) && (
        <div style={{background:T.orange+"22", borderBottom:`1px solid ${T.orange}55`, color:T.orange, fontSize:11, fontWeight:600, textAlign:"center", padding:"4px 8px", flexShrink:0}}>
          📡 Mode hors-ligne — vos données sont sauvegardées localement et seront synchronisées dès le retour de la connexion
        </div>
      )}
      
      {pinModal && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.95)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:2000}}>
          <div style={{background:T.surface, borderRadius:32, padding:24, width:"90%", maxWidth:360, textAlign:"center"}}>
            <div style={{fontSize:48, marginBottom:12}}>👑</div>
            <div style={{fontSize:18, fontWeight:800, marginBottom:8}}>Accès Administrateur</div>
            <div style={{fontSize:12, color:T.textMute, marginBottom:20}}>Entrez votre code PIN à 4 chiffres</div>
            <div style={{display:"flex", gap:12, justifyContent:"center", marginBottom:20, animation: pinShake ? "shake 0.35s ease" : "none"}}>
              {Array(4).fill(0).map((_,i)=><div key={i} style={{width:16,height:16,borderRadius:"50%", background: i < pinInput.length ? (pinError ? T.red : T.accent) : T.border}} />)}
            </div>
            {pinError && <div style={{fontSize:12, color:T.red, marginBottom:16}}>✗ Code incorrect</div>}
            <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:8}}>
              {[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map((d,i)=>(
                <button key={i} onClick={()=>{ if(d==="⌫") setPinInput(p=>p.slice(0,-1)); else if(d!=="") setPinInput(p=>p.length<4 ? p+d : p); }} style={{background:d===""?"transparent":T.surface2, border:`1px solid ${T.border}`, borderRadius:12, height:55, fontSize:22, color:d==="⌫"?T.red:T.text}}>{d}</button>
              ))}
            </div>
            <button onClick={verifyAdminPin} style={{marginTop:16, background:T.accent, border:"none", borderRadius:12, padding:12, width:"100%", fontWeight:700, color:T.bg}}>Valider</button>
            <button onClick={()=>{setPinModal(false); setPinInput("");}} style={{marginTop:8, background:"transparent", border:"none", color:T.textMute}}>Annuler</button>
          </div>
        </div>
      )}
      
      <div className="pos-header" style={{background:T.header, padding:"8px 12px", borderBottom:`1px solid ${T.border}`, display:"flex", justifyContent:"space-between", alignItems:"center", flexShrink:0, gap:6}}>
        <div style={{minWidth:0}}>
          <div style={{fontSize:10, color:T.textMute, whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{session.shopName}</div>
          <div style={{fontFamily:"'Outfit'", fontWeight:800, color:T.accent, fontSize:15, lineHeight:1.2}}>Caisse Pro</div>
        </div>
        <div style={{display:"flex", gap:6, alignItems:"center", flexShrink:0}}>
          <div className="hdr-themes theme-toggle" style={{background:T.surface2}}>
            <button className={`theme-btn${themeName==="auto"?"  active":""}`} onClick={()=>setThemeName("auto")} title="Automatique (système)" style={{background:themeName==="auto"?T.accent:"transparent", color:themeName==="auto"?T.bg:T.textSub}}>⚙️</button>
            <button className={`theme-btn${themeName==="light"?" active":""}`} onClick={()=>setThemeName("light")} title="Mode clair"           style={{background:themeName==="light"?T.accent:"transparent", color:themeName==="light"?T.bg:T.textSub}}>☀️</button>
            <button className={`theme-btn${themeName==="dark"?"  active":""}`} onClick={()=>setThemeName("dark")}  title="Mode sombre"           style={{background:themeName==="dark"?T.accent:"transparent",  color:themeName==="dark"?T.bg:T.textSub}}>🌙</button>
            <button className={`theme-btn${themeName==="neon"?"  active":""}`} onClick={()=>setThemeName("neon")}  title="Néon"                  style={{background:themeName==="neon"?T.accent:"transparent",  color:themeName==="neon"?T.bg:T.textSub}}>⚡</button>
          </div>
          <button className="hdr-btn" onClick={()=>setMode("CAISSE")} style={{background:mode==="CAISSE"?T.accent:"transparent", border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:mode==="CAISSE"?T.bg:T.textSub}}>🛒<span className="hdr-text-label"> Caisse</span></button>
          <button className="hdr-btn" onClick={()=>{ setOwnerMode(false); setMode("STOCK"); }} style={{background:mode==="STOCK"&&!ownerMode?T.accent:"transparent", border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:mode==="STOCK"&&!ownerMode?T.bg:T.textSub}}>📦<span className="hdr-text-label"> Stock</span></button>
          <button className="hdr-btn" onClick={()=>{ setOwnerMode(false); setMode("STATS"); }} style={{background:mode==="STATS"&&!ownerMode?T.accent:"transparent", border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:mode==="STATS"&&!ownerMode?T.bg:T.textSub}}>📊<span className="hdr-text-label"> Stats</span></button>
          {!ownerMode ? (
            <button className="hdr-btn" onClick={enterOwnerMode} style={{background:T.btnBlue.bg, border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:T.blue}}>👑<span className="hdr-text-label"> Admin</span></button>
          ) : (
            <button className="hdr-btn" onClick={exitOwnerMode} style={{background:T.btnRed.bg, border:"none", borderRadius:8, padding:"6px 10px", fontWeight:700, color:T.red}}>🔒<span className="hdr-text-label"> Quitter</span></button>
          )}
          <button className="hdr-btn" onClick={logout} style={{background:"transparent", border:`1px solid ${T.border}`, borderRadius:8, padding:"4px 8px", fontSize:11}}>↩<span className="hdr-text-label"> Déco</span></button>
        </div>
      </div>
      
      {mode === "CAISSE" && (
        <div className="desktop-grid" style={{flex:1, overflow:"hidden", position:"relative"}}>
          {/* caissier bar */}
          {caissiers.length > 0 && (
            <div style={{display:"flex", alignItems:"center", gap:8, padding:"4px 12px", background:T.surface2, borderBottom:`1px solid ${T.border}`, flexShrink:0}}>
              <span style={{fontSize:11, color:T.textMute}}>👤</span>
              {currentCaissier
                ? <><span style={{fontSize:11, fontWeight:600}}>{currentCaissier.name}</span><button onClick={logoutCaissier} style={{fontSize:10, background:"transparent", border:"none", color:T.red}}>Quitter</button></>
                : <span style={{fontSize:11, color:T.orange}}>Aucun caissier — cliquez Admin → Caissiers</span>
              }
            </div>
          )}
          <div className="desktop-main" style={{flex:1, overflowY:"auto", padding:12}}>
            <BLEStatus T={T} />
            <div style={{display:"flex", gap:6, marginBottom:8, flexWrap:"wrap"}}>
              <button onClick={()=>{ setUseBLE(true); const f="80mm"; setTicketFormat(f); localStorage.setItem("pos_ticket_fmt",f); }} style={{flex:"1 0 auto", background:useBLE&&ticketFormat==="80mm"?T.accent:T.surface, borderRadius:12, padding:6, fontSize:11, fontWeight:600, color:useBLE&&ticketFormat==="80mm"?T.bg:T.text}}>🖨️ BLE 80mm</button>
              <button onClick={()=>{ setUseBLE(true); const f="57mm"; setTicketFormat(f); localStorage.setItem("pos_ticket_fmt",f); }} style={{flex:"1 0 auto", background:useBLE&&ticketFormat==="57mm"?T.accent:T.surface, borderRadius:12, padding:6, fontSize:11, fontWeight:600, color:useBLE&&ticketFormat==="57mm"?T.bg:T.text}}>🖨️ BLE 57mm</button>
              <button onClick={()=>setUseBLE(false)} style={{flex:"1 0 auto", background:!useBLE?T.accent:T.surface, borderRadius:12, padding:6, fontSize:11, fontWeight:600, color:!useBLE?T.bg:T.text}}>🖥️ Navigateur</button>
            </div>
            <CaisseContent T={T} products={products} addSale={addSale} items={items} setItems={setItems} total={total} flashMsg={flashMsg} sales={sales} cancelSale={cancelSale} />
            {/* Spacer so FAB doesn't cover last product card */}
            <div style={{height:80}} />
          </div>

          {/* ── Desktop sidebar (hidden on mobile/tablet via CSS) ── */}
          <div className="desktop-sidebar" style={{background:T.surface, borderLeft:`1px solid ${T.border}`}}>
            <PanierContent T={T} items={items} setItems={setItems} total={total} addSale={addSale} addCredit={addCredit} flashMsg={flashMsg} useBLE={useBLE} ticketFormat={ticketFormat} />
          </div>

          {/* ── FAB panier mobile/tablette ── */}
          <button
            className="mobile-cart-fab"
            onClick={()=>setMobileCartOpen(true)}
            style={{
              position:"fixed", bottom:24, right:20, zIndex:500,
              background:items.length>0 ? T.accent : T.surface2,
              border:`2px solid ${items.length>0 ? T.accent : T.border}`,
              borderRadius:32, minWidth:64, height:64, padding:"0 16px",
              flexDirection:"column", alignItems:"center", justifyContent:"center",
              boxShadow:"0 6px 24px rgba(0,0,0,.45)", gap:2
            }}
          >
            <span style={{fontSize:26}}>🛒</span>
            {items.length > 0 && (
              <span style={{fontSize:9, fontWeight:800, color:items.length>0?T.bg:T.textSub, lineHeight:1}}>
                {items.reduce((s,i)=>s+(i.qty||1),0)} · {fmtPrice(total)}
              </span>
            )}
          </button>

          {/* ── Bottom-sheet panier mobile/tablette ── */}
          {mobileCartOpen && (
            <div
              className="mobile-cart-overlay"
              onClick={e=>{if(e.target===e.currentTarget) setMobileCartOpen(false);}}
              style={{
                position:"fixed", inset:0, zIndex:600,
                background:"rgba(0,0,0,.55)", display:"flex",
                flexDirection:"column", justifyContent:"flex-end"
              }}
            >
              <div style={{
                background:T.surface, borderRadius:"20px 20px 0 0",
                maxHeight:"82dvh", display:"flex", flexDirection:"column",
                overflow:"hidden"
              }}>
                {/* Drag handle + close */}
                <div style={{padding:"10px 16px 6px", display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:`1px solid ${T.border}`, flexShrink:0}}>
                  <div style={{display:"flex", alignItems:"center", gap:8}}>
                    <div style={{width:36, height:4, background:T.border, borderRadius:2}} />
                    <span style={{fontWeight:700, fontSize:15}}>🛒 Panier</span>
                  </div>
                  <button onClick={()=>setMobileCartOpen(false)} style={{background:T.surface2, border:"none", borderRadius:20, width:32, height:32, fontSize:16, color:T.text}}>✕</button>
                </div>
                <div style={{flex:1, overflow:"hidden", display:"flex", flexDirection:"column"}}>
                  <PanierContent
                    T={T} items={items} setItems={setItems} total={total}
                    addSale={(itms, tot, print) => { addSale(itms, tot, print); setMobileCartOpen(false); }}
                    addCredit={(itms,tot,name) => { addCredit(itms,tot,name); setMobileCartOpen(false); }}
                    flashMsg={flashMsg} useBLE={useBLE} ticketFormat={ticketFormat}
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      )}
      
      {ownerMode && (
        <OwnerContent T={T} shopName={session.shopName} whatsapp={session.whatsapp} products={products} setProducts={setProducts} sales={sales} flashMsg={flashMsg} shopId={session.shopId} stockMovements={stockMovements} updateStock={updateStock} updateAdminPin={updateAdminPin} credits={credits} payCredit={payCredit} caissiers={caissiers} saveCaissier={saveCaissier} deleteCaissier={deleteCaissier} loginCaissier={loginCaissier} currentCaissier={currentCaissier} shopLogo={shopLogo} setShopLogo={setShopLogo} />
      )}

      {mode === "STOCK" && !ownerMode && (
        <StockModuleExterne T={T} products={products} stockMovements={stockMovements} updateStock={updateStock} />
      )}

      {mode === "STATS" && !ownerMode && (
        <StatsModuleExterne T={T} products={products} sales={sales} credits={credits} shopId={session.shopId} shopName={session.shopName} whatsapp={session.whatsapp} flashMsg={flashMsg} />
      )}
    </div>
  );
}

function CaisseContent({ T, products, addSale, items, setItems, total, flashMsg, sales, cancelSale }) {
  const [view, setView] = useState("catalog");
  const [search, setSearch] = useState("");
  const [activeCat, setActiveCat] = useState("Tous");
  const [manualLabel, setManualLabel] = useState("");
  const [manualAmount, setManualAmount] = useState("");
  const [cancelModal, setCancelModal] = useState(null);
  const [cancelRaison, setCancelRaison] = useState("");
  const [scannerActive, setScannerActive] = useState(false);
  const videoRef = React.useRef(null);
  const scannerRef = React.useRef(null);
  
  const allProds = (products || []).filter(p => p && p.active !== false && p.name);
  const categories = ["Tous", ...Array.from(new Set(allProds.map(p=>p.category).filter(Boolean)))];
  const filtered = allProds.filter(p => {
    const matchCat = activeCat === "Tous" || p.category === activeCat;
    const matchSearch = p.name.toLowerCase().includes(search.toLowerCase());
    return matchCat && matchSearch;
  });
  const todaySalesAll = (sales || []).filter(s => s.date === new Date().toISOString().slice(0,10));
  const todaySales = todaySalesAll.filter(s => !s.cancelled);
  
  const addProduct = (p) => {
    if (p.stock !== undefined && p.stock !== null && p.stock !== -1 && p.stock <= 0) { flashMsg(`⚠️ ${p.name} en rupture`); return; }
    const exist = items.find(i=>i.productId===p.id);
    if(exist) setItems(items.map(i=>i.productId===p.id?{...i, qty:(i.qty||1)+1}:i));
    else setItems([...items, {id:Date.now()+Math.random(), productId:p.id, label:p.name, amount:p.price, qty:1}]);
    flashMsg(`➕ ${p.name}`);
  };
  
  const addManual = () => { if(!manualLabel.trim() || !manualAmount) { flashMsg("Nom et montant requis"); return; } setItems([...items, {id:Date.now()+Math.random(), label:manualLabel.trim(), amount:parseInt(manualAmount), qty:1}]); setManualLabel(""); setManualAmount(""); };

  const startScanner = async () => {
    if (!('BarcodeDetector' in window)) { flashMsg("⚠️ Scanner non supporté sur ce navigateur"); return; }
    setScannerActive(true);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      if (videoRef.current) { videoRef.current.srcObject = stream; videoRef.current.play(); }
      const detector = new BarcodeDetector({ formats: ["ean_13","ean_8","code_128","qr_code","upc_a","upc_e"] });
      scannerRef.current = setInterval(async () => {
        if (!videoRef.current) return;
        try {
          const barcodes = await detector.detect(videoRef.current);
          if (barcodes.length > 0) {
            const code = barcodes[0].rawValue;
            stopScanner();
            const found = products.find(p => p.barcode === code);
            if (found) { addProduct(found); flashMsg(`📷 ${found.name} ajouté`); }
            else { flashMsg(`📷 Code: ${code} — produit non trouvé`); }
          }
        } catch(e){}
      }, 500);
    } catch(e) { setScannerActive(false); flashMsg("❌ Accès caméra refusé"); }
  };
  
  const stopScanner = () => {
    clearInterval(scannerRef.current);
    if (videoRef.current?.srcObject) { videoRef.current.srcObject.getTracks().forEach(t=>t.stop()); videoRef.current.srcObject = null; }
    setScannerActive(false);
  };

  React.useEffect(() => () => stopScanner(), []);
  
  return (
    <div style={{display:"flex", flexDirection:"column", height:"100%", overflow:"hidden"}}>
      <div style={{display:"flex", gap:6, marginBottom:12, overflowX:"auto", paddingBottom:2, flexShrink:0}}>
        <button onClick={()=>setView("catalog")} style={{flex:"1 0 auto", background:view==="catalog"?T.accent:T.surface, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:view==="catalog"?T.bg:T.text}}>📦 Catalogue</button>
        <button onClick={()=>setView("manual")} style={{flex:"1 0 auto", background:view==="manual"?T.accent:T.surface, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:view==="manual"?T.bg:T.text}}>✏️ Manuel</button>
        <button onClick={()=>setView("rapide")} style={{flex:"1 0 auto", background:view==="rapide"?T.accent:T.surface, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:view==="rapide"?T.bg:T.text}}>⚡ Rapide</button>
        <button onClick={()=>setView("annulations")} style={{flex:"1 0 auto", background:view==="annulations"?T.red:T.surface, borderRadius:12, padding:"8px 10px", fontWeight:600, fontSize:12, color:view==="annulations"?T.bg:T.text}}>🗑️ Annul.</button>
      </div>
      
      {view === "catalog" && (
        <>
          <div style={{display:"flex", gap:6, marginBottom:8}}>
            <input placeholder="🔍 Rechercher..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1, background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:10, color:T.text}} />
            <button onClick={scannerActive ? stopScanner : startScanner} style={{background:scannerActive?T.red:T.surface, border:"none", borderRadius:12, padding:"0 12px", fontSize:18}} title="Scanner code-barres">{scannerActive?"⏹️":"📷"}</button>
          </div>
          {scannerActive && (
            <div style={{marginBottom:10, borderRadius:12, overflow:"hidden", position:"relative"}}>
              <video ref={videoRef} style={{width:"100%", maxHeight:160, objectFit:"cover", display:"block"}} />
              <div style={{position:"absolute", inset:0, border:"2px solid "+T.accent, borderRadius:12, pointerEvents:"none"}} />
              <div style={{position:"absolute", bottom:6, left:0, right:0, textAlign:"center", fontSize:10, color:"white", textShadow:"0 1px 3px #000"}}>Pointez vers un code-barres</div>
            </div>
          )}
          {categories.length > 1 && (
            <div style={{display:"flex", gap:6, overflowX:"auto", paddingBottom:6, marginBottom:8}}>
              {categories.map(cat=>(
                <button key={cat} onClick={()=>setActiveCat(cat)} style={{flex:"0 0 auto", background:activeCat===cat?T.accent:T.surface2, borderRadius:20, padding:"4px 12px", fontSize:11, fontWeight:600, color:activeCat===cat?T.bg:T.text, whiteSpace:"nowrap"}}>{cat}</button>
              ))}
            </div>
          )}
          <div style={{display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:8, overflowY:"auto", maxHeight:"calc(100vh - 280px)", paddingBottom:8}}>
            {filtered.map(p => (
              <button key={p.id} onClick={()=>addProduct(p)} style={{background:T.surface, border:`1px solid ${T.border}`, borderRadius:12, padding:10, textAlign:"left", minWidth:0}}>
                <div style={{fontWeight:600, fontSize:13, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.name}</div>
                <div style={{fontSize:12, color:T.accent, fontWeight:700}}>{fmtPrice(p.price)}</div>
                {p.category && <div style={{fontSize:9, color:T.textMute, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap"}}>{p.category}</div>}
                {p.stock !== undefined && p.stock !== null && p.stock !== -1 && <div style={{fontSize:9, color:p.stock<=5?T.red:T.textMute}}>Stock: {p.stock}</div>}
              </button>
            ))}
          </div>
        </>
      )}
      
      {view === "manual" && (
        <div style={{background:T.surface, borderRadius:16, padding:16}}>
          <input placeholder="Nom article" value={manualLabel} onChange={e=>setManualLabel(e.target.value)} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:10, marginBottom:8, color:T.text}} />
          <input placeholder="Montant (F)" value={manualAmount} onChange={e=>setManualAmount(e.target.value.replace(/\D/g,""))} style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:10, marginBottom:12, color:T.text}} />
          <button onClick={addManual} style={{background:T.accent, border:"none", borderRadius:12, padding:12, fontWeight:700, width:"100%", color:T.bg}}>➕ Ajouter</button>
        </div>
      )}
      
      {view === "rapide" && <VenteRapide T={T} addSale={addSale} flashMsg={flashMsg} />}
      
      {view === "annulations" && (() => {
        const ventesActives = todaySalesAll.filter(s => !s.cancelled);
        const ventesAnnulees = todaySalesAll.filter(s => s.cancelled);
        const SaleCard = ({ s, annulable }) => {
          const heure = s.timestamp ? new Date(s.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}) : "--:--";
          const nbArt = (s.items||[]).reduce((a,i)=>a+(i.qty||1),0);
          return (
            <div style={{background:T.surface, borderRadius:16, padding:14, marginBottom:10, borderLeft:`4px solid ${annulable?T.accent:T.red}`, opacity:annulable?1:0.6}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:8}}>
                <div>
                  <div style={{display:"flex", alignItems:"center", gap:6, flexWrap:"wrap"}}>
                    <span style={{fontSize:14, fontWeight:700}}>{heure}</span>
                    <span style={{fontSize:9, background:annulable?"#00ff0022":"#ff000022", color:annulable?T.green:T.red, borderRadius:6, padding:"2px 7px", fontWeight:700}}>
                      {annulable?"✅ Validée":"🗑️ Annulée"}
                    </span>
                  </div>
                  {s.caissier && <div style={{fontSize:10, color:T.textMute, marginTop:2}}>👤 {s.caissier}</div>}
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:18, fontWeight:800, color:annulable?T.accent:T.textMute}}>{fmtPrice(s.total)}</div>
                  <div style={{fontSize:9, color:T.textMute}}>{nbArt} art.</div>
                </div>
              </div>
              {(s.items||[]).length>0 && (
                <div style={{background:T.surface2, borderRadius:10, padding:"6px 10px", marginBottom:annulable?10:6}}>
                  {(s.items||[]).slice(0,3).map((it,i)=>(
                    <div key={i} style={{display:"flex", justifyContent:"space-between", fontSize:11, padding:"3px 0", borderBottom:i<Math.min((s.items||[]).length,3)-1?`1px solid ${T.border}`:"none"}}>
                      <span style={{overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap", maxWidth:"60%"}}>{it.label}</span>
                      <span style={{color:T.textMute, flexShrink:0}}>×{it.qty||1} <strong style={{color:T.text}}>{fmtPrice((it.amount||0)*(it.qty||1))}</strong></span>
                    </div>
                  ))}
                  {(s.items||[]).length>3 && <div style={{fontSize:10, color:T.textMute, paddingTop:3}}>+{(s.items||[]).length-3} autre(s)…</div>}
                </div>
              )}
              {!annulable && s.cancelRaison && (
                <div style={{fontSize:10, color:T.textMute, fontStyle:"italic"}}>Motif : {s.cancelRaison}</div>
              )}
              {annulable && (
                <button onClick={()=>{setCancelModal(s); setCancelRaison("");}}
                  style={{width:"100%", background:"#ff000015", border:`1px solid ${T.red}44`, borderRadius:10, padding:"9px", color:T.red, fontWeight:700, fontSize:12}}>
                  🗑️ Annuler cette vente
                </button>
              )}
            </div>
          );
        };
        return (
          <div style={{overflowY:"auto", overflowX:"hidden", flex:1, WebkitOverflowScrolling:"touch", paddingBottom:24}}>
            {ventesActives.length===0 && ventesAnnulees.length===0 && (
              <div style={{textAlign:"center", padding:50, color:T.textMute}}>
                <div style={{fontSize:32, marginBottom:8}}>🧾</div>
                <div style={{fontSize:13}}>Aucune vente aujourd'hui</div>
              </div>
            )}
            {ventesActives.length>0 && (
              <>
                <div style={{fontSize:11, fontWeight:700, color:T.textMute, marginBottom:8, letterSpacing:".5px"}}>ANNULABLES · {ventesActives.length}</div>
                {[...ventesActives].sort((a,b)=>(b.timestamp||0)-(a.timestamp||0)).map(s=><SaleCard key={s.id} s={s} annulable={true}/>)}
              </>
            )}
            {ventesAnnulees.length>0 && (
              <>
                <div style={{fontSize:11, fontWeight:700, color:T.textMute, margin:"14px 0 8px", letterSpacing:".5px"}}>DÉJÀ ANNULÉES · {ventesAnnulees.length}</div>
                {[...ventesAnnulees].sort((a,b)=>(b.cancelledAt||b.timestamp||0)-(a.cancelledAt||a.timestamp||0)).map(s=><SaleCard key={s.id} s={s} annulable={false}/>)}
              </>
            )}
          </div>
        );
      })()}

      {cancelModal && (() => {
        const MOTIFS = ["Erreur de saisie","Client a changé d'avis","Doublon","Mauvais produit","Autre"];
        const motifValide = cancelRaison.trim().length>0;
        const motifRapide = MOTIFS.includes(cancelRaison) && cancelRaison!=="Autre";
        return (
          <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.82)", display:"flex", alignItems:"flex-end", justifyContent:"center", zIndex:1000}}>
            <div style={{background:T.surface, borderRadius:"24px 24px 0 0", padding:"20px 20px 36px", width:"100%", maxWidth:480}}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
                <div style={{fontSize:16, fontWeight:800, color:T.red}}>🗑️ Annuler la vente</div>
                <button onClick={()=>{setCancelModal(null);setCancelRaison("");}} style={{background:T.surface2, border:"none", borderRadius:50, width:32, height:32, fontSize:15, color:T.textMute, display:"flex", alignItems:"center", justifyContent:"center"}}>✕</button>
              </div>
              {/* Récap */}
              <div style={{background:T.surface2, borderRadius:12, padding:"10px 14px", marginBottom:14, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <div>
                  <div style={{fontSize:11, color:T.textMute}}>
                    {cancelModal.timestamp?new Date(cancelModal.timestamp).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):""}
                    {cancelModal.caissier?` · 👤 ${cancelModal.caissier}`:""}
                  </div>
                  <div style={{fontSize:11, color:T.textMute}}>{(cancelModal.items||[]).reduce((a,i)=>a+(i.qty||1),0)} article(s)</div>
                </div>
                <div style={{fontSize:20, fontWeight:800, color:T.accent}}>{fmtPrice(cancelModal.total)}</div>
              </div>
              {/* Motifs rapides */}
              <div style={{fontSize:11, fontWeight:700, color:T.textMute, marginBottom:8}}>Motif</div>
              <div style={{display:"flex", flexWrap:"wrap", gap:7, marginBottom:12}}>
                {MOTIFS.map(m=>(
                  <button key={m} onClick={()=>setCancelRaison(m)}
                    style={{background:cancelRaison===m?T.red:"#ff000015", border:`1px solid ${cancelRaison===m?T.red:T.border}`, borderRadius:20, padding:"7px 13px", fontSize:12, fontWeight:600, color:cancelRaison===m?"#fff":T.text}}>
                    {m}
                  </button>
                ))}
              </div>
              {/* Champ libre (si Autre ou texte libre) */}
              {(!motifRapide) && (
                <textarea placeholder="Précisez le motif..." value={cancelRaison==="Autre"?"":cancelRaison} onChange={e=>setCancelRaison(e.target.value)}
                  rows="2" style={{width:"100%", background:T.inputBg, border:`1px solid ${T.inputBd}`, borderRadius:12, padding:"10px 12px", color:T.text, fontSize:12, resize:"none", marginBottom:14}} />
              )}
              {motifRapide && <div style={{marginBottom:14}}/>}
              {/* Boutons */}
              <div style={{display:"flex", gap:10}}>
                <button onClick={()=>{setCancelModal(null);setCancelRaison("");}}
                  style={{flex:1, background:T.surface2, border:"none", borderRadius:14, padding:"13px", fontWeight:600, fontSize:13, color:T.text}}>
                  Retour
                </button>
                <button onClick={()=>{ if(!motifValide){flashMsg("Choisissez un motif");return;} cancelSale(cancelModal.id,cancelRaison); setCancelModal(null); setCancelRaison(""); }}
                  style={{flex:2, background:motifValide?T.red:T.surface2, border:"none", borderRadius:14, padding:"13px", fontWeight:800, fontSize:13, color:motifValide?"#fff":T.textMute}}>
                  ✅ Confirmer l'annulation
                </button>
              </div>
            </div>
          </div>
        );
      })()}
    </div>
  );
}

  const removeItem = (id) => setItems(items.filter(i=>i.id!==id));
  const clearCart = () => { if(confirm("Annuler toute la vente ?")) setItems([]); };
  const cartTotal = items.reduce((s,i)=>s+(i.qty||1),0);
  const printLabel = useBLE ? `🖨️ BLE ${ticketFormat||"80mm"} + Valider` : "🖥️ Imprimer + Valider";

  return (

            <div style={{display:"flex", justifyContent:"space-between", marginTop:4}}>

      <div style={{padding:12, borderTop:`1px solid ${T.border}`, flexShrink:0, background:T.surface}}>
        <div style={{display:"flex", justifyContent:"space-between", marginBottom:8, fontSize:18, fontWeight:800}}><span>TOTAL</span><span style={{color:T.accent}}>{fmtPrice(total)}</span></div>
        <button onClick={()=>{ if(items.length) addSale(items, total, true); else flashMsg("Panier vide"); }} style={{width:"100%", background:T.green, border:"none", borderRadius:12, padding:12, fontWeight:700, color:T.bg, fontSize:13}}>{printLabel}</button>
        <button onClick={()=>{ if(items.length) addSale(items, total, false); else flashMsg("Panier vide"); }} style={{marginTop:6, width:"100%", background:T.blue, border:"none", borderRadius:12, padding:11, fontWeight:700, color:T.bg}}>✅ Valider sans ticket</button>
        <button onClick={()=>{ if(items.length) setCreditModal(true); else flashMsg("Panier vide"); }} style={{marginTop:6, width:"100%", background:T.orange||"#f59e0b", border:"none", borderRadius:12, padding:11, fontWeight:700, color:"#fff"}}>💳 Vendre à crédit</button>
      </div>
      {creditModal && (
        <div style={{position:"fixed", inset:0, background:"rgba(0,0,0,0.92)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1200}}>
          <div style={{background:T.surface, borderRadius:24, padding:20, width:"90%", maxWidth:360}}>
            <div style={{fontSize:18, fontWeight:800, marginBottom:4}}>💳 Vente à crédit</div>
            <div style={{fontSize:12, color:T.textMute, marginBottom:12}}>Total: <strong>{fmtPrice(total)}</strong></div>
            <input autoFocus placeholder="Nom du client (obligatoire)" value={clientName} onChange={e=>setClientName(e.target.value)} style={{width:"100%", background:T.inputBg, borderRadius:12, padding:12, marginBottom:14, color:T.text}} />
            <div style={{display:"flex", gap:8}}>
              <button onClick={()=>{setCreditModal(false); setClientName("");}} style={{flex:1, background:T.surface2, borderRadius:12, padding:12}}>Annuler</button>
              <button onClick={()=>{ if(clientName.trim()){ addCredit(items, total, clientName.trim()); setCreditModal(false); setClientName(""); } else flashMsg("Nom requis"); }} style={{flex:1, background:T.orange||"#f59e0b", borderRadius:12, padding:12, fontWeight:700, color:"#fff"}}>Enregistrer</button>
